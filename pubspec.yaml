dev_dependencies:
  flutter_test:
    sdk: flutter
  freezed: ^3.0.6
  json_serializable: ^6.7.1
  build_runner: ^2.4.15
  drift_dev: ^2.34.0
  injectable_generator: ^3.0.2
  auto_route_generator:
  flutter_lints: ^6.0.0
  flutter_gen_runner: ^5.11.0
  # Flavor
  flutter_flavorizr: ^2.3.1

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/rates/
    - assets/images/
    - assets/images/logo/
    - assets/images/onboarding/
    - assets/images/languages/
    - assets/lottie/

  # Plus Jakarta Sans (OFL, has Vietnamese glyphs) — bundled for offline use
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Regular.ttf
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/plus_jakarta_sans/PlusJakartaSans-ExtraBold.ttf
          weight: 800

#generate
flutter_gen:
  output: lib/src/gen/ # Optional (default: lib/gen/)
  line_length: 80 # Optional (default: 80)

  integrations:
    flutter_svg: true
    lottie: true

  assets:
    outputs:
      class_name: Assets